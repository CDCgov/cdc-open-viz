name: Reject Sass sources

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-sass-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Sass files and direct dependencies
        run: |
          sass_files=$(find packages _stories -type f \( -name '*.scss' -o -name '*.sass' \) -print)

          if [ -n "$sass_files" ]; then
            echo "Error: Sass source files remain:"
            echo "$sass_files"
            exit 1
          fi

          if grep -R -n '"sass"[[:space:]]*:' package.json packages --include=package.json; then
            echo "Error: direct Sass dependencies remain."
            exit 1
          fi

          echo "No Sass sources or direct dependencies found."
