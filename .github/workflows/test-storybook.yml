name: Test Storybook

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev, test]

jobs:
  storybook-tests:
    # Playwright 1.57 does not support Ubuntu 26.04; restore ubuntu-latest after upgrading to 1.61+.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Packages
        run: yarn build

      - name: Install Playwright with dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Storybook and ARIA command name tests
        run: yarn test-storybook
